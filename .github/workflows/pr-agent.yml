name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent
    steps:
      - id: pragent
        uses: Codium-ai/pr-agent@main
        env:
          GOOGLE_AI_STUDIO_GEMINI_API_KEY: ${{ secrets.OPENAI_KEY }}
          GEMINI_API_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.model: "gemini/gemini-2.5-pro"
          github_action_config.fallback_models: "[\"gemini/gemini-2.5-flash\"]"
